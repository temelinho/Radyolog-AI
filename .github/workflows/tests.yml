name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bağımlılıklar (çekirdek testleri için yeterli)
        run: pip install numpy scipy scikit-image nibabel
      - name: Birim testleri (pipeline çekirdeği)
        run: python -m unittest discover -s tests -v
